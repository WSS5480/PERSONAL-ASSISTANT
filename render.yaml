# Render Blueprint: one web service + one Postgres.
# Secrets are sync:false (Render asks for them when the Blueprint is created; set them later under Environment).
services:
  - type: web
    name: my-assistant
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: my-assistant-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ASSISTANT_MODEL
        value: claude-sonnet-5-5
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: SIGNUP_CODE
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DOMO_INSTANCE
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: RENDER_API_KEY
        sync: false

databases:
  - name: my-assistant-db
    plan: basic-256mb
    databaseName: my_assistant
    user: my_assistant
